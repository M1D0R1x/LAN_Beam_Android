<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>LAN Beam</title>
<style>
:root {
  --bg:#f5f6fa; --surface:#fff; --surface2:#eef0f6; --line:#e2e5ee;
  --text:#0f172a; --muted:#5b6478; --accent:#4f46e5; --accent2:#8b5cf6; --accent-soft:#eef2ff; --on-accent:#fff;
  --ok:#16a34a; --err:#dc2626; --radius:18px; --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0b0c10; --surface:#15161c; --surface2:#1d1f27; --line:#272a35;
    --text:#eceef4; --muted:#9aa0b0; --accent:#a5b4fc; --accent2:#c4b5fd; --accent-soft:#1e1b4b; --on-accent:#111133;
    --ok:#4ade80; --err:#f87171; --shadow:0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--bg); color:var(--text); }
body { font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
button:focus-visible, a:focus-visible, .row:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ── Header ── */
header { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line); }
.bar { max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; }
.logo { width:40px; height:40px; border-radius:11px; flex:none; box-shadow:0 4px 14px rgba(79,70,229,.35); }
.brand { flex:1; min-width:0; }
.brand h1 { font-size:18px; font-weight:700; letter-spacing:-.015em; line-height:1.2; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--err); flex:none; }
.dot.on { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.connect-btn { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); font-weight:600; font-size:14px; box-shadow:var(--shadow); }
.connect-btn span { display:none; }
@media (min-width:560px) { .connect-btn span { display:inline; } }

.tabs { max-width:1180px; margin:0 auto; padding:0 20px 12px; display:flex; gap:4px; }
.tabs-inner { display:flex; flex:1; gap:4px; background:var(--surface2); border-radius:13px; padding:4px; }
.tab { flex:1; padding:9px 8px; border-radius:10px; font-weight:600; font-size:14px; color:var(--muted); }
.tab.active { background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.badge { display:inline-block; min-width:18px; padding:0 6px; margin-left:6px; border-radius:9px; background:var(--accent); color:var(--on-accent); font-size:11px; line-height:18px; }

/* ── Layout: tabs on phones, two columns on wide screens ── */
.layout { max-width:1180px; margin:0 auto; padding:16px 16px calc(110px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:minmax(0,1fr); gap:20px; }
main { min-width:0; }
.search input[type=search] { -webkit-appearance:none; appearance:none; }
@media (max-width:559px) { .bar { padding:10px 16px; } .tabs { padding:0 16px 10px; } .panel { padding:12px; border-radius:16px; } }
@media (min-width:960px) {
  .tabs { display:none; }
  .layout { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); align-items:start; }
  #view-files, #view-send { display:block !important; }
  #view-send { position:sticky; top:84px; }
}
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
.panel-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.panel-head h2 { font-size:16px; font-weight:700; flex:1; }
.panel-head .sub { font-size:13px; color:var(--muted); font-weight:500; }
.link-btn { color:var(--accent); font-weight:600; font-size:14px; padding:6px 8px; border-radius:8px; }
.link-btn:hover { background:var(--accent-soft); }

.search { display:flex; align-items:center; gap:8px; background:var(--surface2); border-radius:12px; padding:0 12px; margin-bottom:10px; color:var(--muted); }
.search input { flex:1; border:0; background:none; font:inherit; color:var(--text); padding:10px 0; outline:none; min-width:0; }

.crumbs { display:flex; gap:2px; flex-wrap:wrap; align-items:center; margin:0 0 8px; font-size:14px; }
.crumbs button { padding:4px 8px; border-radius:8px; color:var(--muted); font-weight:600; }
.crumbs button:hover { background:var(--surface2); }
.crumbs button:last-child { color:var(--text); }
.crumbs span { color:var(--muted); opacity:.5; }

.list { display:flex; flex-direction:column; gap:4px; }
.row { display:flex; align-items:center; gap:12px; padding:8px 6px 8px 8px; border-radius:12px; min-height:58px; cursor:pointer; transition:background .12s; }
.row:hover { background:var(--surface2); }
.row.selected { background:var(--accent-soft); }
.thumb { position:relative; width:42px; height:42px; border-radius:11px; flex:none; display:grid; place-items:center; overflow:hidden; font-size:10px; font-weight:800; letter-spacing:.03em; }
.thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.info { flex:1; min-width:0; }
.name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meta { font-size:12.5px; color:var(--muted); }
.actions { display:flex; gap:2px; flex:none; }
.act { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:var(--muted); }
.act:hover { background:var(--surface); color:var(--accent); box-shadow:var(--shadow); }
.act.danger:hover { color:var(--err); }
.check { width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:none; display:grid; place-items:center; color:var(--on-accent); font-size:13px; }
.row.selected .check { background:var(--accent); border-color:var(--accent); }

.drop { border:2px dashed var(--line); border-radius:16px; padding:26px 16px; text-align:center; transition:border-color .15s, background .15s; }
.drop.over { border-color:var(--accent); background:var(--accent-soft); }
.drop-icon { width:52px; height:52px; margin:0 auto 12px; border-radius:16px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,#4338ca,#8b5cf6); box-shadow:0 6px 18px rgba(79,70,229,.35); }
.drop-icon svg { width:26px; height:26px; }
.drop p { color:var(--muted); font-size:14px; margin-top:10px; }
.primary { background:var(--accent); color:var(--on-accent); font-weight:650; padding:12px 22px; border-radius:12px; font-size:15px; }
.primary:hover { filter:brightness(1.07); }
.dest { font-size:13px; color:var(--muted); margin-top:6px; }
.dest b { color:var(--text); font-weight:600; }

.up { padding:10px 8px; border-radius:12px; }
.up + .up { border-top:1px solid var(--line); }
.up-head { display:flex; align-items:center; gap:10px; }
.bar-p { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; margin:8px 0 0 52px; }
.bar-p i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:3px; transition:width .2s linear; }
.up.done .bar-p i { background:var(--ok); }
.up.error .bar-p i { background:var(--err); }
.up .meta b { font-weight:600; color:var(--ok); }
.summary { font-size:13px; color:var(--muted); margin:-4px 0 6px; }
.section-gap { margin-top:18px; }

.empty { text-align:center; color:var(--muted); padding:34px 16px; font-size:14px; }
.empty b { display:block; color:var(--text); font-size:15px; margin-bottom:4px; }
.skel { height:58px; border-radius:12px; background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%); background-size:200% 100%; animation:sh 1.4s infinite; }
@keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }

footer { text-align:center; font-size:12.5px; color:var(--muted); padding:8px 20px 28px; }

.selbar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); width:min(720px,calc(100% - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 10px 10px 16px; display:flex; align-items:center; gap:8px; box-shadow:0 12px 40px rgba(0,0,0,.2); z-index:30; }
.selbar .grow { flex:1; font-weight:600; }
.ghost { padding:9px 12px; border-radius:10px; font-weight:600; font-size:14px; background:var(--surface2); }

.modal { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:grid; place-items:center; padding:16px; }
.sheet { background:var(--surface); border-radius:22px; padding:24px; width:min(380px,100%); text-align:center; }
.sheet h3 { font-size:17px; }
.sheet img.qr { width:220px; height:220px; background:#fff; border-radius:14px; padding:10px; margin:16px auto; display:block; }
.sheet code { font-size:15px; font-weight:700; color:var(--accent); word-break:break-all; }
.viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
.viewer img, .viewer video { max-width:100%; max-height:78vh; border-radius:10px; }
.viewer .bar2 { display:flex; gap:10px; }
.viewer .bar2 button, .viewer .bar2 a { background:rgba(255,255,255,.14); color:#fff; padding:10px 16px; border-radius:10px; font-weight:600; text-decoration:none; }

/* Hidden with visibility, not just transform, so no sliver shows under the address bar. */
.toast { position:fixed; left:50%; top:16px; transform:translate(-50%,-12px); opacity:0; visibility:hidden; background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:550; z-index:90; transition:opacity .2s, transform .2s, visibility .2s; max-width:calc(100% - 32px); pointer-events:none; }
.toast.show { transform:translate(-50%,0); opacity:1; visibility:visible; }
.hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <svg class="logo" viewBox="0 0 108 108" aria-hidden="true" style="stroke:none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
      <rect width="108" height="108" fill="url(#lg)"/>
      <g transform="translate(54 54) scale(1.45) translate(-54 -54)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="54" cy="54" r="27" stroke="#fff" stroke-opacity=".3" stroke-width="2.5"/>
        <path d="M45 69V40M36 49l9-9 9 9M63 39v29M54 59l9 9 9-9" stroke="#fff" stroke-width="6.5"/>
      </g>
    </svg>
    <div class="brand">
      <h1>LAN Beam</h1>
      <div class="pill"><span class="dot" id="dot"></span><span id="device">Connecting…</span></div>
    </div>
    <button class="connect-btn" id="info-btn" aria-label="Connect another device">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
      <span>Connect a device</span>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <div class="tabs-inner">
      <button class="tab" role="tab" data-tab="files" id="tab-files">Files on phone</button>
      <button class="tab" role="tab" data-tab="send" id="tab-send">Send to phone<span class="badge hidden" id="send-badge"></span></button>
    </div>
  </div>
</header>

<div class="layout">
  <main id="view-files">
    <section class="panel">
      <div class="panel-head"><h2>Files on phone <span class="sub" id="files-count"></span></h2><button class="link-btn" id="select-toggle">Select</button></div>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="filter" type="search" placeholder="Search files" aria-label="Search files"></label>
      <div class="crumbs" id="crumbs"></div>
      <div class="list" id="files"></div>
    </section>
  </main>

  <main id="view-send" class="hidden">
    <section class="panel">
      <div class="panel-head"><h2>Send to phone</h2></div>
      <div class="drop" id="drop">
        <div class="drop-icon"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></div>
        <button class="primary" id="pick">Choose files</button>
        <p>or drag them here · sending starts right away</p>
        <div class="dest">Saved on <b id="dest-name">the phone</b> in Download/LANBeam</div>
        <input type="file" id="file-input" multiple hidden>
      </div>
      <div class="section-gap hidden" id="queue-section">
        <div class="panel-head"><h2>Sending</h2><button class="link-btn" id="clear-done">Clear finished</button></div>
        <div class="summary" id="summary"></div>
        <div id="queue"></div>
      </div>
      <div class="section-gap">
        <div class="panel-head"><h2>Received on phone</h2></div>
        <div class="list" id="received"></div>
      </div>
    </section>
  </main>
</div>
<footer>Files move directly between your devices over your local network. Nothing is uploaded to the internet.</footer>

<div class="selbar hidden" id="selbar">
  <span class="grow" id="sel-count">0 selected</span>
  <button class="ghost" id="sel-all">All</button>
  <button class="primary" id="sel-zip" style="padding:9px 14px;font-size:14px">Download ZIP</button>
  <button class="act" id="sel-close" aria-label="Cancel selection"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="overlay"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const CHUNK = 8 * 1024 * 1024;   // bytes per request; a failed request re-sends at most this much
const PARALLEL = 2;              // files in flight at once
const MAX_FAILS = 12;            // consecutive failed attempts before a file is marked failed

let info = {};
let tab = localStorage.getItem('lb_tab') || 'files';
let path = '/';
let listing = [];
let selecting = false;
const selected = new Set();
const queue = [];
let active = 0;
let ws = null, wsDelay = 1000, wsUp = false;

// ─── Icons ───
const ICON = {
  down: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  retry: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>',
};
const COLORS = { video:'#ef4444', image:'#10b981', audio:'#f59e0b', pdf:'#dc2626', archive:'#8b5cf6', apk:'#22c55e', folder:'#3b82f6', doc:'#64748b' };

// ─── Helpers ───
function fmtSize(b) {
  if (!b || b <= 0) return '0 B';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b : b.toFixed(b >= 100 ? 0 : 1)) + ' ' + u[i];
}
function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ext(name) { const i = name.lastIndexOf('.'); const e = i > 0 ? name.slice(i + 1) : ''; return /^[a-z0-9]{1,4}$/i.test(e) ? e.toUpperCase() : 'FILE'; }
function typeOf(name) {
  const e = ext(name).toLowerCase();
  if (/^(mp4|mkv|mov|avi|webm|wmv|flv|m4v|ts|3gp)$/.test(e)) return 'video';
  if (/^(mp3|flac|wav|m4a|aac|ogg|wma|opus)$/.test(e)) return 'audio';
  if (/^(jpg|jpeg|png|gif|webp|svg|bmp|heic|heif|avif)$/.test(e)) return 'image';
  if (e === 'pdf') return 'pdf';
  if (/^(zip|tar|gz|rar|7z|bz2|xz|tgz)$/.test(e)) return 'archive';
  if (/^(apk|apks|xapk)$/.test(e)) return 'apk';
  return 'doc';
}
function badge(type, name, img) {
  const c = COLORS[type] || COLORS.doc;
  return `<div class="thumb" style="background:${c}22;color:${c}">${type === 'folder' ? 'DIR' : esc(ext(name))}${img || ''}</div>`;
}
function joinPath(base, name) { return base === '/' ? name : base + '/' + name; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r.json();
}

// ─── Tabs ───
function setTab(t) {
  tab = t; localStorage.setItem('lb_tab', t);
  $('tab-files').classList.toggle('active', t === 'files');
  $('tab-send').classList.toggle('active', t === 'send');
  $('tab-files').setAttribute('aria-selected', t === 'files');
  $('tab-send').setAttribute('aria-selected', t === 'send');
  $('view-files').classList.toggle('hidden', t !== 'files');
  $('view-send').classList.toggle('hidden', t !== 'send');
  if (selecting) setSelecting(false);
  if (wide.matches) { loadFiles(path); loadReceived(); }
  else if (t === 'files') loadFiles(path); else loadReceived();
}
const wide = window.matchMedia('(min-width: 960px)');
wide.addEventListener?.('change', () => setTab(tab));

// ─── Info / connection ───
async function loadInfo() {
  try {
    info = await getJSON('/api/info');
    $('device').textContent = 'Connected to ' + info.hostname;
    $('dot').classList.add('on');
    $('dest-name').textContent = info.hostname;
    document.title = 'LAN Beam · ' + info.hostname;
    connectWS();
  } catch (e) { $('device').textContent = 'Phone not reachable'; setDot(false); }
}
function setDot(on) { $('dot').classList.toggle('on', on); }
function connectWS() {
  if (ws && ws.readyState <= 1) return;
  try {
    ws = new WebSocket('ws://' + location.hostname + ':' + (info.wsPort || 8766));
    ws.onopen = () => { wsUp = true; wsDelay = 1000; setDot(true); };
    ws.onmessage = ev => {
      let d; try { d = JSON.parse(ev.data); } catch (_) { return; }
      if (d.type === 'files_changed' || d.type === 'file_deleted' || d.type === 'upload_complete') refresh();
    };
    ws.onclose = () => { wsUp = false; setTimeout(connectWS, wsDelay = Math.min(wsDelay * 2, 30000)); };
    ws.onerror = () => ws.close();
  } catch (_) { wsUp = false; }
}
let refreshTimer;
function refresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    if (wide.matches || tab === 'files') loadFiles(path, true);
    if (wide.matches || tab === 'send') loadReceived(true);
  }, 250);
}
setInterval(async () => {
  if (document.hidden) return;
  try { await getJSON('/api/ping'); setDot(true); } catch (_) { setDot(false); }
  if (!wsUp && !active) refresh();
}, 15000);

function showConnect() {
  const url = info.url || location.origin;
  $('overlay').innerHTML = `<div class="modal" id="m"><div class="sheet" role="dialog" aria-label="Connect another device">
    <b>Connect another device</b>
    <img class="qr" src="/api/qr?t=${Date.now()}" alt="QR code for ${esc(url)}">
    <code>${esc(url)}</code>
    <p class="meta" style="margin-top:10px">Scan with a phone camera or type the address in any browser on the same Wi-Fi.</p>
    <div style="margin-top:16px"><button class="ghost" id="m-close">Close</button></div></div></div>`;
  $('m').onclick = e => { if (e.target.id === 'm' || e.target.id === 'm-close') $('overlay').innerHTML = ''; };
}

// ─── Files on phone ───
async function loadFiles(p, quiet) {
  path = p;
  renderCrumbs();
  if (!quiet) $('files').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    listing = await getJSON('/api/files?path=' + encodeURIComponent(p));
    listing.sort((a, b) => (a.type === 'folder') !== (b.type === 'folder') ? (a.type === 'folder' ? -1 : 1) : a.name.localeCompare(b.name));
    renderFiles();
  } catch (e) {
    $('files').innerHTML = `<div class="empty"><b>Couldn't load files</b>${esc(e.message)}<br><br><button class="ghost" onclick="loadFiles(path)">Try again</button></div>`;
  }
}
function renderCrumbs() {
  const parts = path.split('/').filter(Boolean);
  let html = `<button data-p="/">Shared</button>`, acc = '';
  parts.forEach(p => { acc = acc ? acc + '/' + p : p; html += `<span>/</span><button data-p="${esc(acc)}">${esc(p)}</button>`; });
  $('crumbs').innerHTML = html;
}
$('crumbs').onclick = e => { const b = e.target.closest('button'); if (b) loadFiles(b.dataset.p); };

let query = '';
$('filter').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderFiles(); });
function visible() { return query ? listing.filter(f => f.name.toLowerCase().includes(query)) : listing; }
function renderFiles() {
  const files = listing.filter(f => f.type !== 'folder').length;
  const folders = listing.length - files;
  $('files-count').textContent = listing.length ? [folders && folders + ' folder' + (folders > 1 ? 's' : ''), files && files + ' file' + (files > 1 ? 's' : '')].filter(Boolean).join(' · ') : '';
  $('select-toggle').classList.toggle('hidden', !files);
  if (!listing.length) {
    $('files').innerHTML = `<div class="empty"><b>No files shared yet</b>On the phone, tap “Add files” or share files to LAN Beam from any app.</div>`;
    return;
  }
  const shown = visible();
  if (!shown.length) { $('files').innerHTML = `<div class="empty"><b>No match</b>Nothing named “${esc(query)}” here.</div>`; return; }
  $('files').innerHTML = shown.map(f => { const i = listing.indexOf(f);
    const full = joinPath(path, f.name);
    const isDir = f.type === 'folder';
    const sel = selected.has(full);
    const thumb = f.type === 'image'
      ? badge('image', f.name, `<img loading="lazy" alt="" src="/api/thumbnail?size=96&path=${encodeURIComponent(full)}" onerror="this.remove()">`)
      : badge(f.type, f.name);
    const meta = isDir ? `${f.items || 0} items` : `${fmtSize(f.size)} · ${f.modified}`;
    const actions = selecting || isDir ? '' :
      `<div class="actions"><a class="act" href="/api/download?path=${encodeURIComponent(full)}" download="${esc(f.name)}" aria-label="Download ${esc(f.name)}">${ICON.down}</a></div>`;
    return `<div class="row${sel ? ' selected' : ''}" tabindex="0" data-i="${i}">${selecting && !isDir ? `<div class="check">${sel ? '✓' : ''}</div>` : ''}${thumb}
      <div class="info"><div class="name">${esc(f.name)}</div><div class="meta">${meta}</div></div>${actions}</div>`;
  }).join('');
}
$('files').onclick = e => {
  const row = e.target.closest('.row'); if (!row) return;
  const f = listing[+row.dataset.i]; if (!f) return;
  if (e.target.closest('a')) return toast('Downloading ' + f.name);
  const full = joinPath(path, f.name);
  if (f.type === 'folder') return loadFiles(full);
  if (selecting) { selected.has(full) ? selected.delete(full) : selected.add(full); updateSel(); return renderFiles(); }
  openFile(full, f.type, f.name);
};
$('files').onkeydown = e => { if (e.key === 'Enter' && e.target.classList.contains('row')) e.target.click(); };

function setSelecting(on) {
  selecting = on; selected.clear();
  $('select-toggle').textContent = on ? 'Done' : 'Select';
  $('selbar').classList.toggle('hidden', !on);
  updateSel(); renderFiles();
}
function updateSel() {
  $('sel-count').textContent = selected.size + ' selected';
  $('sel-zip').disabled = !selected.size;
  $('sel-zip').style.opacity = selected.size ? 1 : .5;
}
$('select-toggle').onclick = () => setSelecting(!selecting);
$('sel-close').onclick = () => setSelecting(false);
$('sel-all').onclick = () => {
  const all = listing.filter(f => f.type !== 'folder').map(f => joinPath(path, f.name));
  if (selected.size === all.length) selected.clear(); else all.forEach(p => selected.add(p));
  updateSel(); renderFiles();
};
$('sel-zip').onclick = () => {
  if (!selected.size) return;
  if (selected.size === 1) { download([...selected][0]); return setSelecting(false); }
  const form = document.createElement('form');
  form.method = 'POST'; form.action = '/api/download-zip'; form.style.display = 'none';
  const input = document.createElement('input');
  input.type = 'hidden'; input.name = 'files_json'; input.value = JSON.stringify([...selected]);
  form.appendChild(input); document.body.appendChild(form); form.submit();
  setTimeout(() => form.remove(), 1000);
  toast('Preparing ZIP of ' + selected.size + ' files…');
  setSelecting(false);
};
function download(full) {
  const a = document.createElement('a');
  a.href = '/api/download?path=' + encodeURIComponent(full);
  a.download = full.split('/').pop();
  document.body.appendChild(a); a.click(); a.remove();
  toast('Downloading ' + a.download);
}

function openFile(full, type, name) {
  const src = '/api/stream?path=' + encodeURIComponent(full);
  let media = '';
  if (type === 'image') media = `<img src="${src}" alt="${esc(name)}">`;
  else if (type === 'video') media = `<video src="${src}" controls autoplay playsinline></video>`;
  else if (type === 'audio') media = `<div style="color:#fff;font-weight:600">${esc(name)}</div><audio src="${src}" controls autoplay></audio>`;
  else return download(full);
  $('overlay').innerHTML = `<div class="viewer" id="v">${media}<div class="bar2">
    <a href="/api/download?path=${encodeURIComponent(full)}" download="${esc(name)}">Download</a><button id="v-close">Close</button></div></div>`;
  $('v').onclick = e => { if (e.target.id === 'v' || e.target.id === 'v-close') $('overlay').innerHTML = ''; };
}

// ─── Received on phone ───
let received = [];
async function loadReceived(quiet) {
  if (!quiet) $('received').innerHTML = '<div class="skel"></div>';
  try {
    received = await getJSON('/api/files?path=uploads');
    received.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
    $('received').innerHTML = received.length ? received.map((f, i) => {
      const full = 'uploads/' + f.name;
      return `<div class="row" data-i="${i}">${badge(f.type, f.name)}<div class="info"><div class="name">${esc(f.name)}</div><div class="meta">${fmtSize(f.size)} · ${f.modified}</div></div>
        <div class="actions"><a class="act" href="/api/download?path=${encodeURIComponent(full)}" download="${esc(f.name)}" aria-label="Download ${esc(f.name)}">${ICON.down}</a>
        <button class="act danger" data-del="${i}" aria-label="Delete ${esc(f.name)} from phone">${ICON.trash}</button></div></div>`;
    }).join('') : '<div class="empty"><b>Nothing received yet</b>Files you send appear here.</div>';
  } catch (e) {
    $('received').innerHTML = `<div class="empty"><b>Couldn't load</b>${esc(e.message)}</div>`;
  }
}
$('received').onclick = async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const f = received[+del.dataset.del];
    if (!f || !confirm('Delete “' + f.name + '” from the phone?')) return;
    const r = await fetch('/api/file?path=' + encodeURIComponent('uploads/' + f.name), { method: 'DELETE' });
    toast(r.ok ? 'Deleted' : 'Could not delete');
    loadReceived(true);
    return;
  }
  const row = e.target.closest('.row');
  if (row && !e.target.closest('a')) { const f = received[+row.dataset.i]; if (f) openFile('uploads/' + f.name, f.type, f.name); }
};

// ─── Sending (resumable chunked uploads, start on selection) ───
function newId() { return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); }
function resumeKey(f) { return 'lb_up:' + f.name + ':' + f.size + ':' + f.lastModified; }

function enqueue(files) {
  if (!files.length) return;
  for (const file of files) {
    const key = resumeKey(file);
    const id = localStorage.getItem(key) || newId();
    localStorage.setItem(key, id);
    queue.push({ id, key, file, sent: 0, status: 'queued', note: '', speed: 0, lastT: 0, lastB: 0, xhr: null, finalName: '' });
  }
  $('queue-section').classList.remove('hidden');
  renderQueue(); pump();
}

function pump() {
  while (active < PARALLEL) {
    const next = queue.find(q => q.status === 'queued');
    if (!next) break;
    active++;
    run(next).finally(() => { active--; renderQueue(); pump(); onQueueIdle(); });
  }
}

async function run(item) {
  item.status = 'uploading'; item.note = ''; item.startedAt = performance.now();
  try {
    await upload(item);
    item.status = 'done';
    localStorage.removeItem(item.key);
  } catch (e) {
    if (item.status !== 'cancelled') { item.status = 'error'; item.note = e.message || 'Failed'; }
  }
}

async function upload(item) {
  const f = item.file, total = f.size;
  let offset = 0, fails = 0;
  try { offset = (await getJSON('/api/upload/chunk?id=' + item.id)).offset || 0; } catch (_) {}
  if (offset > total) offset = 0;
  item.sent = offset;
  for (;;) {
    const end = Math.min(offset + CHUNK, total);
    try {
      const r = await sendChunk(item, offset, end, total);
      fails = 0; item.note = '';
      offset = r.offset;
      if (r.done) { item.finalName = r.filename; item.sent = total; return; }
    } catch (e) {
      if (item.status === 'cancelled') throw e;
      if (e.status === 409 && typeof e.offset === 'number') { offset = e.offset; item.sent = offset; continue; }
      if (e.status >= 400 && e.status < 500) throw new Error(e.message || ('Rejected (' + e.status + ')'));
      if (++fails > MAX_FAILS) throw new Error('Connection lost - tap retry');
      item.note = 'Connection dropped · retrying'; renderQueue();
      await sleep(Math.min(500 * 2 ** (fails - 1), 10000));
      try { offset = (await getJSON('/api/upload/chunk?id=' + item.id)).offset; item.sent = offset; } catch (_) {}
    }
  }
}

function sendChunk(item, start, end, total) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    item.xhr = xhr;
    const q = `id=${encodeURIComponent(item.id)}&name=${encodeURIComponent(item.file.name)}&offset=${start}&total=${total}`;
    xhr.open('POST', '/api/upload/chunk?' + q);
    xhr.timeout = 120000;
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = e => { item.sent = start + e.loaded; tick(item); };
    xhr.onload = () => {
      let body = {}; try { body = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status === 200) resolve(body);
      else reject(Object.assign(new Error(body.error || xhr.statusText), { status: xhr.status, offset: body.offset }));
    };
    xhr.onerror = () => reject(Object.assign(new Error('Network error'), { status: 0 }));
    xhr.ontimeout = () => reject(Object.assign(new Error('Timed out'), { status: 0 }));
    xhr.onabort = () => reject(Object.assign(new Error('Cancelled'), { status: -1 }));
    xhr.send(item.file.slice(start, end));
  });
}

function tick(item) {
  const now = performance.now();
  if (!item.lastT) { item.lastT = now; item.lastB = item.sent; }
  const dt = (now - item.lastT) / 1000;
  if (dt >= 0.5) {
    const inst = (item.sent - item.lastB) / dt;
    item.speed = item.speed ? item.speed * 0.6 + inst * 0.4 : inst;
    item.lastT = now; item.lastB = item.sent;
  }
  scheduleRender();
}
let renderPending = false;
function scheduleRender() { if (!renderPending) { renderPending = true; requestAnimationFrame(() => { renderPending = false; renderQueue(); }); } }

function renderQueue() {
  const running = queue.filter(q => q.status === 'uploading' || q.status === 'queued');
  const badgeEl = $('send-badge');
  badgeEl.textContent = running.length; badgeEl.classList.toggle('hidden', !running.length);
  if (!queue.length) { $('queue-section').classList.add('hidden'); return; }
  const speed = queue.filter(q => q.status === 'uploading').reduce((s, q) => s + q.speed, 0);
  const left = running.reduce((s, q) => s + (q.file.size - q.sent), 0);
  const done = queue.filter(q => q.status === 'done').length;
  $('summary').textContent = running.length
    ? `${done} of ${queue.length} sent · ${fmtSize(speed)}/s${speed > 0 ? ' · ' + fmtTime(left / speed) + ' left' : ''}`
    : `${done} of ${queue.length} sent`;
  $('queue').innerHTML = queue.map((q, i) => {
    const pct = q.file.size ? Math.min(100, q.sent / q.file.size * 100) : (q.status === 'done' ? 100 : 0);
    let meta;
    if (q.status === 'done') meta = `<b>Sent</b> · ${fmtSize(q.file.size)}${q.finalName && q.finalName !== q.file.name ? ' · saved as ' + esc(q.finalName) : ''}`;
    else if (q.status === 'error') meta = `<span style="color:var(--err)">${esc(q.note)}</span>`;
    else if (q.status === 'cancelled') meta = 'Cancelled';
    else if (q.status === 'queued') meta = `Waiting · ${fmtSize(q.file.size)}`;
    else meta = `${fmtSize(q.sent)} of ${fmtSize(q.file.size)}${q.speed ? ' · ' + fmtSize(q.speed) + '/s' : ''}${q.note ? ' · ' + esc(q.note) : ''}`;
    const btn = (q.status === 'error' || q.status === 'cancelled')
      ? `<button class="act" data-retry="${i}" aria-label="Retry ${esc(q.file.name)}">${ICON.retry}</button>`
      : (q.status === 'done' ? '' : `<button class="act danger" data-cancel="${i}" aria-label="Cancel ${esc(q.file.name)}">${ICON.x}</button>`);
    return `<div class="up ${q.status}"><div class="up-head">${badge(typeOf(q.file.name), q.file.name)}
      <div class="info"><div class="name">${esc(q.file.name)}</div><div class="meta">${meta}</div></div>${btn}</div>
      <div class="bar-p"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;
  }).join('');
}

$('queue').onclick = e => {
  const c = e.target.closest('[data-cancel]'), r = e.target.closest('[data-retry]');
  if (c) {
    const q = queue[+c.dataset.cancel];
    const wasUploading = q.status === 'uploading';
    q.status = 'cancelled';
    if (q.xhr) q.xhr.abort();
    if (wasUploading) fetch('/api/upload/chunk?id=' + q.id, { method: 'DELETE' }).catch(() => {});
    localStorage.removeItem(q.key);
    renderQueue();
  } else if (r) {
    const q = queue[+r.dataset.retry];
    if (q.status === 'cancelled') { q.id = newId(); localStorage.setItem(q.key, q.id); q.sent = 0; }
    q.status = 'queued'; q.note = ''; q.speed = 0; q.lastT = 0;
    renderQueue(); pump();
  }
};
$('clear-done').onclick = () => {
  for (let i = queue.length - 1; i >= 0; i--) if (queue[i].status === 'done' || queue[i].status === 'cancelled') queue.splice(i, 1);
  renderQueue();
};
function onQueueIdle() {
  if (queue.some(q => q.status === 'uploading' || q.status === 'queued')) return;
  const done = queue.filter(q => q.status === 'done' && !q.announced);
  done.forEach(q => q.announced = true);
  const failed = queue.filter(q => q.status === 'error').length;
  if (done.length) toast(`Sent ${done.length} file${done.length > 1 ? 's' : ''}${failed ? ' · ' + failed + ' failed' : ''}`);
  else if (failed) toast(failed + ' failed - tap retry');
  loadReceived(true);
}
window.addEventListener('beforeunload', e => {
  if (queue.some(q => q.status === 'uploading' || q.status === 'queued')) { e.preventDefault(); e.returnValue = ''; }
});

// Selection starts the upload immediately: picking files is already the explicit choice, and
// every file can still be cancelled mid-flight or deleted from "Received on phone".
$('pick').onclick = () => $('file-input').click();
$('file-input').onchange = () => { enqueue([...$('file-input').files]); $('file-input').value = ''; };
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => enqueue([...e.dataTransfer.files]));
// Dropping anywhere on the Send tab works too.
document.addEventListener('dragover', e => { if (tab === 'send') e.preventDefault(); });
document.addEventListener('drop', e => { if (tab === 'send' && !drop.contains(e.target)) { e.preventDefault(); enqueue([...e.dataTransfer.files]); } });

// ─── Boot ───
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('info-btn').onclick = showConnect;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('overlay').innerHTML = ''; if (selecting) setSelecting(false); } });
loadInfo();
setTab(tab);
</script>
</body>
</html>
